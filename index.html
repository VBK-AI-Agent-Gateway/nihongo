<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nihongo Master · 日英学习</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--accent:#58cc02;--accent2:#1cb0f6;--accent3:#ff9600;--text:#e2e8f0;--muted:#94a3b8;--err:#ff4b4b;--gold:#ffc800}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Hiragino Sans","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#1d3a5f 0%,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 10px 40px}
header{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
h1{font-size:26px;letter-spacing:2px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:flex;gap:14px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;flex-wrap:wrap}
.stats b{color:var(--accent);font-size:18px}
.langswitch{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.langswitch button{border:none;background:transparent;padding:8px 18px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.langswitch button.on{background:var(--accent);color:#0b2b00}
.langswitch button:hover:not(.on){color:var(--accent2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;max-width:960px}
button,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;transition:.15s}
button:hover,select:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#0b2b00;border-color:var(--accent);font-weight:600}
button.blue{background:var(--accent2);color:#04121f;border-color:var(--accent2);font-weight:600}
button.warn{background:var(--accent3);color:#231400;border-color:var(--accent3);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px;max-width:960px;width:100%}
.panel h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;max-width:960px;width:100%;margin-bottom:14px}
.qtype{font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.qtext{font-size:24px;font-weight:700;margin-bottom:6px;line-height:1.5}
.qsub{font-size:15px;color:var(--muted);margin-bottom:14px}
.audio-btn{background:var(--accent2);color:#04121f;border:none;border-radius:50%;width:64px;height:64px;font-size:28px;cursor:pointer;margin-bottom:14px;transition:.15s}
.audio-btn:hover{filter:brightness(1.1);transform:scale(1.05)}
.choices{display:grid;gap:10px;margin-top:10px}
.choice{background:#0b1220;border:2px solid var(--line);border-radius:12px;padding:14px 18px;font-size:17px;cursor:pointer;transition:.15s;text-align:left}
.choice:hover{border-color:var(--accent2);background:rgba(28,176,246,.1)}
.choice.correct{border-color:var(--accent);background:rgba(88,204,2,.2);animation:pop .3s}
.choice.wrong{border-color:var(--err);background:rgba(255,75,75,.2);animation:shake .3s}
.choice.disabled{pointer-events:none;opacity:.7}
.feedback{border-radius:12px;padding:16px 20px;margin-top:14px;display:none}
.feedback.show{display:block;animation:slideIn .3s}
.feedback.good{background:rgba(88,204,2,.15);border:2px solid var(--accent)}
.feedback.bad{background:rgba(255,75,75,.15);border:2px solid var(--err)}
.fb-title{font-size:18px;font-weight:700;margin-bottom:8px}
.feedback.good .fb-title{color:var(--accent)}
.feedback.bad .fb-title{color:var(--err)}
.fb-body{font-size:15px;line-height:1.8;color:var(--text)}
.fb-body .grammar{background:#0b1220;border-left:4px solid var(--accent3);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
.fb-body .grammar b{color:var(--accent3)}
.fb-body .example{color:var(--muted);font-size:14px;margin-top:6px}
.mic-btn{background:var(--err);color:#fff;border:none;border-radius:50%;width:80px;height:80px;font-size:36px;cursor:pointer;margin:10px 0;transition:.15s}
.mic-btn:hover{filter:brightness(1.1);transform:scale(1.05)}
.mic-btn.recording{animation:pulse 1s infinite;background:#ff1c1c}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.6)}70%{box-shadow:0 0 0 20px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
.score-ring{width:120px;height:120px;border-radius:50%;border:8px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:10px auto}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lesson{background:#0b1220;border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-align:center}
.lesson:hover{border-color:var(--accent);transform:translateY(-3px)}
.lesson .icon{font-size:36px;margin-bottom:6px}
.lesson .name{font-weight:700;font-size:16px;margin-bottom:4px}
.lesson .desc{font-size:13px;color:var(--muted)}
.lesson.locked{opacity:.5;pointer-events:none}
.lesson.done{border-color:var(--accent);background:rgba(88,204,2,.1)}
.status{font-size:14px;min-height:20px}
.status.good{color:var(--accent);font-weight:700}
.status.bad{color:var(--err)}
footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
.progress{height:10px;background:#0b1220;border-radius:5px;overflow:hidden;margin-bottom:14px}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s;border-radius:5px}
.grammar-card{background:#0b1220;border-left:4px solid var(--accent3);padding:12px 16px;border-radius:0 8px 8px 0;margin:8px 0;font-size:14px;line-height:1.7}
.grammar-card b{color:var(--accent3);font-size:15px}
.grammar-card .ex{color:var(--muted);margin-top:5px;font-size:13px}
.vocab-table{width:100%;border-collapse:collapse;font-size:15px}
.vocab-table th,.vocab-table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.vocab-table th{color:var(--accent2);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.vocab-table td.term{font-weight:700;font-size:17px}
.vocab-table td.romaji{color:var(--muted);font-style:italic}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Nihongo Master <span>· 日英学习</span></h1>
    <div class="sub">单词 · 听力 · 口语 · 语法详解 · 多邻国式闯关</div>
  </div>
  <div class="langswitch" id="langSwitch">
    <button data-lang="ja" class="on">🇯🇵 日语课程</button>
    <button data-lang="en">🇺🇸 英语课程</button>
  </div>
  <div class="stats">
    <div>连续 <b id="streak">0</b>🔥</div>
    <div>经验 <b id="xp">0</b></div>
    <div>正确率 <b id="acc">0%</b></div>
    <div>总题 <b id="total">0</b></div>
  </div>
</header>

<div class="toolbar">
  <button class="primary" id="homeBtn">🏠 课程首页</button>
  <button class="blue" id="vocabBtn">📚 单词练习</button>
  <button class="warn" id="listenBtn">🎧 听力练习</button>
  <button id="speakBtn">🎤 口语练习</button>
  <button id="grammarBtn">📖 语法详解</button>
  <button id="reviewBtn">🔁 错题本</button>
</div>

<div class="panel">
  <div class="progress"><div class="bar" id="progBar" style="width:0%"></div></div>
  <div class="status" id="status">选择课程或练习模式开始学习</div>
</div>

<div id="content"></div>

<footer>本地运行 · 语音识别依赖浏览器 API（Chrome/Edge 支持日语与英语） · 数据不上传</footer>

<script>
// ===== 日语课程 =====

  {ja:'いいえ',romaji:'iie',en:'No',pos:'adverb',grammar:'否定应答词，语气比「ううん」正式。',example:'いいえ、違います。(No, that is wrong.)'},
  {ja:'すみません',romaji:'sumimasen',en:'Excuse me / Sorry',pos:'phrase',grammar:'万能道歉/搭话用语，餐厅呼叫服务员也用它。',example:'すみません、トイレはどこですか？(Excuse me, where is the restroom?)'},
  {ja:'はじめまして',romaji:'hajimemashite',en:'Nice to meet you',pos:'phrase',grammar:'初次见面专用，后接「よろしくお願いします」。',example:'はじめまして、よろしくお願いします。(Nice to meet you, please take care of me.)'}
 ],
 listen:[

  {say:'ありがとう',answer:'Thank you',wrong:['Please','Excuse me','I am sorry'],grammar:'「ありがとう」= Thank you，正式场合加「ございます」。'},

  {say:'はじめまして',answer:'Nice to meet you',wrong:['How are you?','Good night','I am sorry'],grammar:'「はじめまして」初次见面的寒暄语。'}
 ],
 speak:[

  {ja:'ありがとう',romaji:'arigatou',en:'Thank you',hint:'说出"谢谢"'},
  {ja:'おはようございます',romaji:'ohayou gozaimasu',en:'Good morning',hint:'礼貌早安'},
  {ja:'すみません',romaji:'sumimasen',en:'Excuse me',hint:'打扰/抱歉'},

 ],

  {ja:'なまえ',romaji:'namae',en:'name',pos:'noun',grammar:'「名前」意为名字，询问用「お名前は？」。',example:'お名前は？(What is your name?)'},
  {ja:'がくせい',romaji:'gakusei',en:'student',pos:'noun',grammar:'「学生」，「がく」+「せい」。',example:'わたしはがくせいです。(I am a student.)'},

  {ja:'です',romaji:'desu',en:'is / am / are',pos:'copula',grammar:'日语系词，表示"是"，接在名词后。',example:'わたしはがくせいです。(I am a student.)'},
  {ja:'ともだち',romaji:'tomodachi',en:'friend',pos:'noun',grammar:'「友達」朋友，复数用「みんな」。',example:'ともだちがいます。(I have a friends.)'},
  {ja:'せんせい',romaji:'sensei',en:'teacher',pos:'noun',grammar:'「先生」既指老师也用于医生、作家等尊称。',example:'せんせいはがくせいを教えます。(The teacher teaches students.)'}
 ],
 listen:[

  {say:'おなまえは？',answer:'What is your name?',wrong:['How old are you?','Where are you from?','What do you do?'],grammar:'「お名前は？」省略了「何ですか」，是礼貌问名。'},
  {say:'にほんじんです',answer:'I am Japanese',wrong:['I am Chinese','I am a student','I like Japan'],grammar:'「にほん」+「じん」(人)=日本人。'},
  {say:'しごとをしています',answer:'I am working',wrong:['I am eating','I am a student','I am studying'],grammar:'「〜をしています」表示从事某工作。'},

 ],
 speak:[

  {ja:'にほんじんです',romaji:'nihonjin desu',en:'I am Japanese',hint:'介绍国籍'},

 ],
 grammar:[

  {title:'存在动词「います/あります」',rule:'有生命用「います」，无生命用「あります」。',example:'猫がいます。(There is a cat.)'}
 ]},
{id:'number',icon:'🔢',name:'数字与时间',desc:'いち、に、さん…',locked:false,
 vocab:[

  {ja:'に',romaji:'ni',en:'two',pos:'number',grammar:'数字2，也是时间助词"在…"。',example:'にがつ (February)'},
  {ja:'さん',romaji:'san',en:'three / Mr.',pos:'number',grammar:'数字3，也可作人名敬称后缀。',example:'田中さん (Mr. Tanaka)'},

 ],

  {say:'いち、に、さん',answer:'one, two, three',wrong:['two, three, four','one, two, four','three, four, five'],grammar:'日语数字发音：いち=1、に=2、さん=3。'},
  {say:'よる',answer:'night',wrong:['morning','noon','evening'],grammar:'「よる」= night，对应英文 night。'},

 ],

 ],

 ]},
{id:'food',icon:'🍜',name:'餐饮',desc:'これは何ですか',locked:true,
 vocab:[
  {ja:'たべもの',romaji:'tabemono',en:'food',pos:'noun',grammar:'「食べ物」=食物，「〜もの」表示物。',example:'なにが好きですか？(What food do you like?)'},
  {ja:'のみもの',romaji:'nomimono',en:'drink',pos:'noun',grammar:'「飲み物」=饮料，「のむ」是喝。',example:'みずをのみます。(I drink water.)'},

  {ja:'おいしい',romaji:'oishii',en:'delicious',pos:'i-adj',grammar:'い形容词，直接接名词，否定「おいしくない」。',example:'このラーメンはおいしい。(This ramen is delicious.)'},

 ],
 listen:[
  {say:'これは何ですか',answer:'What is this?',wrong:['What is that?','How much is it?','Where is it?'],grammar:'「これ」= this，「何ですか」= what is。'},

  document.getElementById('xp').textContent=state.xp[k];
  const t=state.total[k],c=state.correct[k];
  document.getElementById('acc').textContent=t?Math.round(c/t*100)+'%':'0%';
  document.getElementById('total').textContent=t;
}
function setStatus(t,cls){const s=document.getElementById('status');s.textContent=t;s.className='status'+(cls?' '+cls:'');}
function setProg(p){document.getElementById('progBar').style.width=p+'%';}
function speakTTS(text,lang){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function ttsLang(){return L()==='ja'?'ja-JP':'en-US';}
function targetLang(){return L()==='ja'?'en-US':'ja-JP';} // 练习目标语言的语音识别语种
function showHome(){
  save();updateHeader();setProg(0);setStatus('当前：'+(L()==='ja'?'🇯🇵 日语课程':'🇺🇸 英语课程')+' · 选择课程或练习模式开始','');
  const c=document.getElementById('content');
  const LS=lessons();
  let html='<div class="panel"><h3>课程（闯关解锁）</h3><div class="lessons">';
  LS.forEach((Lx,i)=>{
    const unlocked=i===0||state.done[L()][LS[i-1].id]||!Lx.locked;
    const done=state.done[L()][Lx.id];
    html+=`<div class="lesson ${done?'done':''} ${unlocked?'':'locked'}" data-id="${Lx.id}"><div class="icon">${Lx.icon}</div><div class="name">${Lx.name}</div><div class="desc">${Lx.desc}</div>${done?'<div style="color:var(--accent);font-weight:700;margin-top:6px">✓ 已完成</div>':unlocked?'':'<div style="color:var(--muted);margin-top:6px">🔒 未解锁</div>'}</div>`;
  });
  html+='</div></div>';
  html+='<div class="panel"><h3>快速练习</h3><div class="lessons"><div class="lesson" data-act="vocab"><div class="icon">📚</div><div class="name">单词</div><div class="desc">随机词汇测验</div></div><div class="lesson" data-act="listen"><div class="icon">🎧</div><div class="name">听力</div><div class="desc">听目标语言选意思</div></div><div class="lesson" data-act="speak"><div class="icon">🎤</div><div class="name">口语</div><div class="desc">语音识别跟读</div></div><div class="lesson" data-act="wrong"><div class="icon">🔁</div><div class="name">错题本</div><div class="desc">'+state.wrongBook[L()].length+' 题待复习</div></div></div></div>';
  c.innerHTML=html;
  c.querySelectorAll('.lesson').forEach(el=>{el.onclick=()=>{const id=el.dataset.id,act=el.dataset.act;if(act==='vocab'){startPractice('vocab');return;}if(act==='listen'){startPractice('listen');return;}if(act==='speak'){startPractice('speak');return;}if(act==='wrong'){startWrong();return;}if(id)startLesson(id);};});
}
function startLesson(id){const LS=lessons();const Lx=LS.find(x=>x.id===id);if(!Lx)return;state.lesson=Lx;state.step=0;const q=[];Lx.vocab.slice(0,5).forEach(v=>q.push({type:'vocab',data:v}));Lx.listen.slice(0,4).forEach(v=>q.push({type:'listen',data:v}));Lx.speak.slice(0,3).forEach(v=>q.push({type:'speak',data:v}));state.queue=q;renderQ();}
function startPractice(type){const LS=lessons();let pool;if(type==='vocab')pool=LS.flatMap(x=>x.vocab);else if(type==='listen')pool=LS.flatMap(x=>x.listen);else pool=LS.flatMap(x=>x.speak);const shuffled=pool.sort(()=>Math.random()-0.5).slice(0,6);state.lesson=null;state.queue=shuffled.map(d=>({type,data:d}));state.step=0;renderQ();}
function startWrong(){if(!state.wrongBook[L()].length){setStatus('错题本为空，太棒了！','good');showHome();return;}state.lesson=null;state.queue=state.wrongBook[L()].slice(0,8).map(w=>({type:w.type,data:w.data}));state.step=0;renderQ();}
function renderQ(){updateHeader();save();if(state.step>=state.queue.length){if(state.lesson){state.done[L()][state.lesson.id]=true;save();}setStatus('本轮完成！经验 +'+(state.step*10),'good');setProg(100);const c=document.getElementById('content');c.innerHTML=`<div class="qcard" style="text-align:center"><div class="score-ring">${Math.round(state.total[L()]?state.correct[L()]/state.total[L()]*100:100)}%</div><div style="font-size:20px;font-weight:700">本轮完成！</div><div style="color:var(--muted);margin-top:8px">经验 +${state.queue.length*10} · 连续 ${state.streak[L()]}🔥</div><button class="primary" style="margin-top:18px" onclick="showHome()">返回课程首页</button></div>`;return;}const q=state.queue[state.step];setProg(Math.round(state.step/state.queue.length*100));setStatus(`第 ${state.step+1}/${state.queue.length} 题 · ${q.type==='vocab'?'单词':q.type==='listen'?'听力':'口语'}`,'');const c=document.getElementById('content');if(q.type==='vocab')renderVocab(q.data);else if(q.type==='listen')renderListen(q.data);else renderSpeak(q.data);}
function renderVocab(v){
  const c=document.getElementById('content');
  const isJA=L()==='ja';
  const term=isJA?v.ja:v.ja;
  const romaji=v.romaji;
  const answer=isJA?v.en:v.en;
  const pool=lessons().flatMap(x=>x.vocab).filter(x=>x.en!==v.en);
  const wrong=[...pool].sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.en);
  const choices=[answer,...wrong].sort(()=>Math.random()-0.5);
  const label=isJA?'📚 单词 · 选择正确英文':'📚 单词 · 选择正确中文';
  const html='<div class="qcard"><div class="qtype">'+label+'</div><div class="qtext">'+term+'</div><div class="qsub">'+romaji+' · '+v.pos+'</div><button class="audio-btn" title="朗读">🔊</button><div class="choices">'+choices.map(ch=>'<div class="choice" data-en="'+ch+'">'+ch+'</div>').join('')+'</div><div class="feedback" id="fb"></div><button class="primary" id="nextBtn" style="margin-top:14px;display:none">下一题 →</button></div>';
  c.innerHTML=html;
  c.querySelector('.audio-btn').onclick=()=>speakTTS(term,ttsLang());
  c.querySelectorAll('.choice').forEach(el=>{el.onclick=()=>{const ok=el.dataset.en===answer;c.querySelectorAll('.choice').forEach(x=>{x.classList.add('disabled');if(x.dataset.en===answer)x.classList.add('correct');});if(!ok)el.classList.add('wrong');grade(ok,{type:'vocab',data:v},'正确答案：<b>'+answer+'</b>',v.grammar,v.example);};});
  document.getElementById('nextBtn').onclick=()=>{state.step++;renderQ();};
}
function renderListen(v){
  const c=document.getElementById('content');
  const choices=[v.answer,...v.wrong].sort(()=>Math.random()-0.5);
  const html='<div class="qcard"><div class="qtype">🎧 听力 · 听'+(L()==='ja'?'日语选英文意思':'英语选中文意思')+'</div><button class="audio-btn" id="playBtn">🔊</button><div class="qsub">点击播放发音（可重复听）</div><div class="choices">'+choices.map(ch=>'<div class="choice" data-en="'+ch+'">'+ch+'</div>').join('')+'</div><div class="feedback" id="fb"></div><button class="primary" id="nextBtn" style="margin-top:14px;display:none">下一题 →</button></div>';
  c.innerHTML=html;
  const play=()=>speakTTS(v.say,ttsLang());
  c.querySelector('#playBtn').onclick=play;
  setTimeout(play,300);
  c.querySelectorAll('.choice').forEach(el=>{el.onclick=()=>{const ok=el.dataset.en===v.answer;c.querySelectorAll('.choice').forEach(x=>{x.classList.add('disabled');if(x.dataset.en===v.answer)x.classList.add('correct');});if(!ok)el.classList.add('wrong');grade(ok,{type:'listen',data:v},'正确答案：<b>'+v.answer+'</b>',v.grammar,'原句：'+v.say);};});
  document.getElementById('nextBtn').onclick=()=>{state.step++;renderQ();};
}
function renderSpeak(v){
  const c=document.getElementById('content');
  const supported=('webkitSpeechRecognition' in window)||('SpeechRecognition' in window);
  const disabledAttr = supported ? '' : 'disabled';
  const titleAttr = supported ? '点击开始录音' : '当前浏览器不支持语音识别';
  const statusText = supported ? '点击麦克风开始朗读（'+(L()==='ja'?'日语':'英语')+'识别）' : '此浏览器不支持语音识别，可点击看提示跳过';
  const html =
    '<div class="qcard">' +
    '<div class="qtype">🎤 口语 · 大声读出'+(L()==='ja'?'日语':'英语')+'句子</div>' +
    '<div class="qtext">'+v.ja+'</div>' +
    '<div class="qsub">'+v.romaji+' — '+v.en+' · '+v.hint+'</div>' +
    '<button class="audio-btn" id="listenBtn">🔊 先听一遍</button>' +
    '<div style="margin-top:10px"><button class="mic-btn" id="micBtn" '+disabledAttr+' title="'+titleAttr+'">🎤</button>' +
    '<div class="qsub" id="micStatus">'+statusText+'</div></div>' +
    '<div class="input-row" id="hintRow" style="display:none"><div style="flex:1;color:var(--muted);font-size:14px">提示：'+v.romaji+' · '+v.en+'</div><button class="blue" id="skipBtn">看提示，继续</button></div>' +
    '<div class="feedback" id="fb"></div>' +
    '<button class="primary" id="nextBtn" style="margin-top:14px;display:none">下一题 →</button>' +
    '</div>';
  c.innerHTML = html;
  document.getElementById('listenBtn').onclick=()=>speakTTS(v.ja,ttsLang());
  const micBtn=document.getElementById('micBtn');
  const fb=document.getElementById('fb');
  const showHint=()=>{document.getElementById('hintRow').style.display='flex';};
  document.getElementById('skipBtn').onclick=()=>{
    grade(false,{type:'speak',data:v},'已跳过（看提示）','口语需要多练习，点击🔊反复跟读，注意音拍节奏与语调。','正确读法：'+v.ja+' ('+v.romaji+')');
  };
  if(supported){
    micBtn.onclick=()=>{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      const rec=new SR(); rec.lang=targetLang(); rec.interimResults=false; rec.maxAlternatives=5;
      micBtn.classList.add('recording');
      document.getElementById('micStatus').textContent='正在聆听…请朗读句子';
      rec.onresult=(e)=>{
        const alts=Array.prototype.slice.call(e.results[0]).map(r=>r.transcript.toLowerCase().replace(/\s+/g,''));
        const target=v.ja.toLowerCase().replace(/\s+/g,'');
        const romaji=v.romaji.toLowerCase().replace(/\s+/g,'');
        const matched=alts.some(a=>a.includes(target)||a.includes(romaji)||target.includes(a)||levenshtein(a,target)<3);
        micBtn.classList.remove('recording');
        document.getElementById('micStatus').textContent='识别结果：'+e.results[0][0].transcript;
        grade(matched,{type:'speak',data:v},matched?'发音相似度良好！':'发音与原文有差异',matched?'继续保持！注意目标语言的重音与连读。':'目标语言是音节语言/重音语言，注意节奏。建议点击🔊反复跟读。','正确读法：'+v.ja+' ('+v.romaji+')');
      };
      rec.onerror=()=>{micBtn.classList.remove('recording');document.getElementById('micStatus').textContent='识别失败，请重试或点击看提示';showHint();};
      rec.onend=()=>{micBtn.classList.remove('recording');if(!fb.classList.contains('show'))showHint();};
      rec.start();
    };
  } else {
    showHint();
  }
  document.getElementById('nextBtn').onclick=()=>{state.step++;renderQ();};
}
function levenshtein(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n];}
function grade(ok,q,correctMsg,grammar,example){
  const k=L();
  state.total[k]++;
  if(ok){state.correct[k]++;state.streak[k]++;state.xp[k]+=10;}
  else{state.streak[k]=0;if(!state.wrongBook[k].some(w=>w.data===q.data))state.wrongBook[k].push(q);}
  save();updateHeader();
  const fb=document.getElementById('fb');
  fb.className='feedback show '+(ok?'good':'bad');
  fb.innerHTML='<div class="fb-title">'+(ok?'✅ 正确！+10 XP':'❌ 错误 · 语法详解')+'</div><div class="fb-body"><div>'+correctMsg+'</div><div class="grammar"><b>📖 语法/词汇详解：</b><br>'+grammar+'</div>'+(example?'<div class="example">例句：'+example+'</div>':'')+(!ok?'<div class="example" style="color:var(--accent3)">已加入错题本，可在「错题本」中复习。</div>':'')+'</div>';
  document.getElementById('nextBtn').style.display='inline-block';
}
// ===== 语言切换 =====
document.querySelectorAll('#langSwitch button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    state.lang=btn.dataset.lang;
    state.lesson=null; state.step=0; state.queue=[];
    save(); showHome();
  };
});
document.getElementById('homeBtn').onclick=showHome;
document.getElementById('vocabBtn').onclick=()=>startPractice('vocab');
document.getElementById('listenBtn').onclick=()=>startPractice('listen');
document.getElementById('speakBtn').onclick=()=>startPractice('speak');
document.getElementById('grammarBtn').onclick=()=>{
  const c=document.getElementById('content');
  const LS=lessons();
  let html='<div class="panel"><h3>📖 语法详解汇总（'+(L()==='ja'?'日语':'英语')+'）</h3>';
  LS.forEach(Lx=>{
    html+='<div style="margin-bottom:14px"><div style="font-weight:700;color:var(--accent);margin-bottom:6px">'+Lx.icon+' '+Lx.name+'</div>';
    Lx.grammar.forEach(g=>{html+='<div class="grammar-card"><b>'+g.title+'</b><br>'+g.rule+'<div class="ex">例：'+g.example+'</div></div>';});
    html+='</div>';
  });
  html+='</div>';
  c.innerHTML=html;setStatus('语法详解汇总','');setProg(0);
};
document.getElementById('reviewBtn').onclick=startWrong;
load();showHome();updateHeader();
</script>
